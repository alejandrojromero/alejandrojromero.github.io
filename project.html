    <script src="projects.js"></script>
    <script src="assets/site.js"></script>
    <script>
    (function () {
        const id = new URLSearchParams(location.search).get('id');
        const p = window.PROJECTS && window.PROJECTS[id];
        if (!p) { location.replace('index.html'); return; }

        document.title = p.title + ' | Alejandro Romero';
        document.getElementById('projectCategory').textContent = p.category || '';
        document.getElementById('projectTitle').textContent = p.title;
        document.getElementById('projectTagline').textContent = p.tagline || '';

        const meta = document.getElementById('projectMeta');
        Object.entries(p.meta || {}).forEach(([label, value]) => {
            const item = document.createElement('div');
            item.className = 'meta-item';
            if (label === 'Tools') {
                const chips = value.split('·').map(t => '<span class="meta-chip">' + t.trim() + '</span>').join('');
                item.innerHTML = '<span class="meta-label">' + label + '</span><span class="meta-value meta-chips">' + chips + '</span>';
            } else {
                item.innerHTML = '<span class="meta-label">' + label + '</span><span class="meta-value">' + value + '</span>';
            }
            meta.appendChild(item);
        });

        const sidebarUl = document.querySelector('#sidebarNav ul');
        const content = document.getElementById('contentArea');
        if (p.layout === 'hub') {
            document.body.classList.add('hub-page');
            document.querySelector('.project-content').classList.add('hub');
            document.getElementById('sidebarNav').style.display = 'none';
            const grid = document.createElement('div');
            grid.className = 'hub-grid' + ((p.entries || []).length === 2 ? ' two' : '');
            (p.entries || []).forEach(e => {
                const card = document.createElement(e.href ? 'a' : 'div');
                card.className = 'hub-card' + (e.image ? '' : ' no-image');
                if (e.href) { card.href = e.href; if (/^https?:/.test(e.href)) { card.target = '_blank'; card.rel = 'noopener'; } }
                const tagsHtml = '<div class="hub-tags">' + (e.tags || []).map(t => '<span>' + t + '</span>').join('') + '</div>';
                const descHtml = '<p>' + e.desc + (e.locked ? ' \ud83d\udd12' : '') + '</p>';
                card.innerHTML = (e.image ? '<img src="' + e.image + '" alt="' + e.title + '" loading="lazy">' : '') +
                    '<div class="hub-card-overlay"><h3>' + e.title + '</h3>' + descHtml + tagsHtml + '</div>';
                if (e.locked) {
                    card.style.cursor = 'pointer';
                    card.addEventListener('click', () => {
                        if (card.querySelector('.lock-note')) return;
                        const note = document.createElement('div');
                        note.className = 'lock-note';
                        note.setAttribute('style', 'position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;white-space:nowrap;font-family:\'Space Mono\',monospace;font-size:12px;color:#fff;background:rgba(10,10,10,0.88);border:1px solid rgba(255,255,255,0.25);border-radius:8px;padding:9px 14px;opacity:0;transition:opacity 0.25s ease;pointer-events:none');
                        note.textContent = '\ud83d\udd12 Parts of this work are under NDA \u2014 contact me for more info';
                        card.style.position = 'relative';
                        card.appendChild(note);
                        requestAnimationFrame(() => { note.style.opacity = '1'; });
                        setTimeout(() => { note.style.opacity = '0'; setTimeout(() => note.remove(), 300); }, 2600);
                    });
                }
                const im = card.querySelector('img');
                if (im) {
                    const fallback = () => { im.remove(); card.classList.add('no-image'); };
                    im.addEventListener('error', fallback);
                    if (im.complete && im.naturalWidth === 0) fallback();
                }
                grid.appendChild(card);
            });
            content.appendChild(grid);
            if (p.games && p.games.length) {
                const gs = document.createElement('div');
                gs.className = 'games-section';
                gs.innerHTML = '<h2>Game Releases Supported</h2><p class="games-sub">The award-winning roster of games released during my time at Blizzard.</p>';
                const gg = document.createElement('div');
                gg.className = 'games-grid';
                p.games.forEach(g => {
                    const a = document.createElement('a');
                    a.className = 'game-tile';
                    a.href = g.href; a.target = '_blank'; a.rel = 'noopener';
                    a.innerHTML = '<img src="' + g.image + '" alt="' + g.title + '" loading="lazy"><span>' + g.title + '</span>';
                    gg.appendChild(a);
                });
                gs.appendChild(gg);
                content.appendChild(gs);
            }
        } else {
        (p.sections || []).forEach((s, i) => {
            const li = document.createElement('li');
            li.innerHTML = '<a href="#' + s.id + '"' + (i === 0 ? ' class="active"' : '') + '>' + s.heading + '</a>';
            sidebarUl.appendChild(li);
            const sec = document.createElement('section');
            sec.className = 'content-section';
            sec.id = s.id;
            sec.innerHTML = '<h2>' + s.heading + '</h2>' + s.html;
            content.appendChild(sec);
        });
        }

        // Sidebar: smooth scroll + scrollspy
        const links = Array.from(document.querySelectorAll('.sidebar-nav a'));
        links.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const target = document.querySelector(link.getAttribute('href'));
                if (target) window.scrollTo({ top: target.getBoundingClientRect().top + window.pageYOffset - 100, behavior: 'smooth' });
            });
        });
        const sections = Array.from(document.querySelectorAll('.content-section'));
        window.addEventListener('scroll', () => {
            if (!sections.length) return;
            let current = sections[0];
            sections.forEach(sec => { if (sec.getBoundingClientRect().top < 160) current = sec; });
            links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + current.id));
        }, { passive: true });

        // Recommended — thumbnail cards, case-study pages only
        const rec = p.layout === 'hub' ? [] : (p.recommended || []).filter(r => window.PROJECTS[r]);
        if (rec.length) {
            document.getElementById('recommended').style.display = '';
            const wrap = document.getElementById('recommendedLinks');
            rec.forEach(r => {
                const rp = window.PROJECTS[r];
                const a = document.createElement('a');
                a.className = 'rec-card';
                a.href = 'project.html?id=' + r;
                a.innerHTML = (rp.thumb ? '<img src="' + rp.thumb + '" alt="' + rp.title + '" loading="lazy">' : '') + '<span>' + rp.title + '</span>';
                const im = a.querySelector('img');
                if (im) im.addEventListener('error', () => im.remove());
                wrap.appendChild(a);
            });
        }

        // Sleek custom controls on case-study videos
        const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
        const ICON_MUTED = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" opacity="0.5"/><path d="M3 3l18 18-1.4 1.4L1.6 4.4z"/></svg>';
        const ICON_SOUND = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path class="snd-wave w1" d="M16.5 8.6a5 5 0 0 1 0 6.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="snd-wave w2" d="M19 6.3a8.4 8.4 0 0 1 0 11.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
        document.querySelectorAll('.content-area video').forEach(v => {
            const shell = document.createElement('div');
            shell.className = 'vid-shell';
            v.parentNode.insertBefore(shell, v);
            shell.appendChild(v);
            const bar = document.createElement('div');
            bar.className = 'vid-bar';
            bar.innerHTML = '<button class="vid-btn vid-play" aria-label="Play/Pause">' + ICON_PAUSE + '</button>' +
                '<div class="vid-track"><div class="vid-progress"></div></div>' +
                '<button class="vid-btn vid-mute" aria-label="Mute/Unmute">' + ICON_MUTED + '</button>' +
                '<button class="vid-btn vid-fs" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>';
            shell.appendChild(bar);
            const playBtn = bar.querySelector('.vid-play');
            const muteBtn = bar.querySelector('.vid-mute');
            const progress = bar.querySelector('.vid-progress');
            const track = bar.querySelector('.vid-track');
            playBtn.addEventListener('click', () => { v.paused ? v.play() : v.pause(); });
            v.addEventListener('click', () => { v.paused ? v.play() : v.pause(); });
            bar.querySelector('.vid-fs').addEventListener('click', () => {
                if (document.fullscreenElement) document.exitFullscreen();
                else (shell.requestFullscreen || shell.webkitRequestFullscreen).call(shell);
            });
            v.addEventListener('play', () => { playBtn.innerHTML = ICON_PAUSE; });
            v.addEventListener('pause', () => { playBtn.innerHTML = ICON_PLAY; });
            muteBtn.addEventListener('click', () => { v.muted = !v.muted; muteBtn.innerHTML = v.muted ? ICON_MUTED : ICON_SOUND; });
            v.addEventListener('timeupdate', () => {
                if (v.duration) progress.style.width = (v.currentTime / v.duration * 100) + '%';
            });
            track.addEventListener('click', (e) => {
                const r = track.getBoundingClientRect();
                if (v.duration) v.currentTime = ((e.clientX - r.left) / r.width) * v.duration;
            });
            const knob = document.createElement('div');
            knob.className = 'vid-knob';
            track.appendChild(knob);
            v.addEventListener('timeupdate', () => {
                if (v.duration) knob.style.left = (v.currentTime / v.duration * 100) + '%';
            });
            let scrubbing = false, wasPlaying = false;
            const seekTo = (clientX) => {
                const r = track.getBoundingClientRect();
                const frac = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
                if (v.duration) {
                    v.currentTime = frac * v.duration;
                    progress.style.width = (frac * 100) + '%';
                    knob.style.left = (frac * 100) + '%';
                }
            };
            track.addEventListener('pointerdown', (e) => {
                scrubbing = true; wasPlaying = !v.paused; v.pause();
                track.setPointerCapture(e.pointerId);
                track.classList.add('scrubbing');
                seekTo(e.clientX);
            });
            track.addEventListener('pointermove', (e) => { if (scrubbing) seekTo(e.clientX); });
            track.addEventListener('pointerup', (e) => {
                if (!scrubbing) return;
                scrubbing = false; track.classList.remove('scrubbing');
                seekTo(e.clientX);
                if (wasPlaying) v.play();
            });
        });

        if (window.bindCursorHovers) window.bindCursorHovers();
    })();
    </script>
    <script src="assets/lightbox.js"></script>
</body>
