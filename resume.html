    <style>
        .resume-toolbar {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            max-width: 1100px; margin: 0 auto; padding: 150px 60px 22px;
        }
        .resume-btn {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: 'Space Mono', monospace; font-size: 13px; color: #1a1a1a;
            border: 1px solid rgba(0,0,0,0.25); border-radius: 8px; background: none;
            padding: 10px 16px; cursor: pointer; text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }
        body.dark-mode .resume-btn { color: #fff; border-color: rgba(255,255,255,0.3); }
        .resume-btn:hover { background: #FF4A00; color: #fff; border-color: #FF4A00; }
        .resume-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .zoom-group { display: flex; align-items: center; gap: 2px; margin-left: auto; }
        .zoom-btn {
            width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
            border: none; border-radius: 50%; background: none; color: #1a1a1a; cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }
        body.dark-mode .zoom-btn { color: #fff; }
        .zoom-btn:hover { background: #FF4A00; color: #fff; }
        .zoom-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
        .zoom-level {
            font-family: 'Space Mono', monospace; font-size: 12px; color: #666;
            min-width: 46px; text-align: center; user-select: none;
        }
        body.dark-mode .zoom-level { color: #aaa; }
        .resume-stage {
            margin: 0 auto 100px; padding: 24px 20px 40px;
            overflow: auto; display: flex; justify-content: center;
        }
        .sheet-holder { width: 816px; height: 1056px; flex: none; }
        .resume-sheet {
            width: 816px; height: 1056px; transform-origin: top left;
            overflow: hidden; background: #fff; border-radius: 12px;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 10px 40px rgba(0,0,0,0.16), 0 2px 10px rgba(0,0,0,0.08);
        }
        .resume-sheet iframe { width: 816px; height: 1056px; border: none; display: block; pointer-events: none; }
        @media (max-width: 900px) {
            .resume-toolbar, .resume-stage { padding-left: 20px; padding-right: 20px; }
        }
    </style>
<link rel="icon" type="image/png" href="assets/favicon.png">

    <script>
        window.__stripDesk = function (frame) {
            try {
                var d = frame.contentDocument;
                var s = d.createElement('style');
                s.textContent = 'doc-page{background:none !important;padding:0 !important;min-height:0 !important;min-width:0 !important} .page{border-radius:0 !important;box-shadow:none !important}';
                d.head.appendChild(s);
            } catch (e) {}
        };
        (function () {
            var zoom = 1, min = 0.5, max = 2;
            var sheet = document.getElementById('sheet');
            var label = document.getElementById('zoomLevel');
            var stage = document.getElementById('stage');
            function fitInitial() {
                var avail = stage.clientWidth - 40;
                if (avail < 816) { zoom = Math.max(min, avail / 816); }
                apply();
            }
            var holder = document.getElementById('holder');
            function apply() {
                sheet.style.transform = 'scale(' + zoom + ')';
                holder.style.width = (816 * zoom) + 'px';
                holder.style.height = (1056 * zoom) + 'px';
                label.textContent = Math.round(zoom * 100) + '%';
            }
            document.getElementById('zoomIn').addEventListener('click', function () { zoom = Math.min(max, zoom + 0.1); apply(); });
            document.getElementById('zoomOut').addEventListener('click', function () { zoom = Math.max(min, zoom - 0.1); apply(); });
            fitInitial();
        })();
    </script>
